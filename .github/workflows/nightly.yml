name: nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { pkg: ./internal/vhdx, fn: FuzzParse }
          - { pkg: ./internal/wslconfig, fn: FuzzParse }
          - { pkg: ./internal/wslver, fn: FuzzParse }
          - { pkg: ./internal/wslerr, fn: FuzzParse }
          - { pkg: ./internal/agent/proto, fn: FuzzReadFrame }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOOS=linux go test ${{ matrix.target.pkg }} -run=^$ -fuzz=${{ matrix.target.fn }} -fuzztime=5m

  runner-drift:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # arm64 is not in the per-PR matrix (too slow); build and test it here.
      - run: go run ./tools/build-agent -version nightly
      - run: go build ./... && go test -count=1 ./...
      - run: go run ./cmd/wslkit doctor check --json > env.json
        shell: pwsh
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-snapshot-${{ matrix.os }}-${{ github.run_id }}
          path: env.json
