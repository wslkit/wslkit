name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pure:
    name: lint, pure tests, cross-compile (linux runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./tools)"
      - name: build the guest agent (linux/amd64, linux/arm64) for embedding
        run: go run ./tools/build-agent -version ci
      - name: guest agent tests (native on this runner)
        run: go test -count=1 ./internal/agent/... ./cmd/wslkit-agent/...
      - name: vet (linux view enforces probe purity)
        run: GOOS=linux go vet ./internal/probe/... ./internal/render/... ./internal/redact/... ./internal/vhdx/... ./internal/disk/ ./internal/wslconfig/... ./internal/wslver/... ./internal/wslerr/... ./internal/peexport/... ./internal/data/... ./internal/fix/ ./internal/fix/actions/... ./internal/agent/proto/... ./internal/agent/mux/... ./internal/agent/relay/... ./internal/agent/config/... ./internal/agent/filter/... ./internal/agent/assuan/...
      - name: pure tests on linux
        run: GOOS=linux go test -count=1 ./internal/probe/... ./internal/render/... ./internal/redact/... ./internal/vhdx/... ./internal/disk/ ./internal/wslconfig/... ./internal/wslver/... ./internal/wslerr/... ./internal/peexport/... ./internal/data/... ./internal/fix/... ./internal/env/ ./internal/cli/... ./internal/agent/...
      - name: race detector on the agent (concurrency lives here)
        run: go test -count=1 -race ./internal/agent/...
      - name: snapshot corpus
        run: GOOS=linux go test -count=1 ./internal/snapshottest/...
      - name: golangci-lint (windows view, so collectors and winapi are linted too)
        uses: golangci/golangci-lint-action@v7
        env:
          GOOS: windows
        with:
          version: latest
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: cross-compile windows/amd64 and windows/arm64
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/wslkit_amd64.exe ./cmd/wslkit
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/wslkit_arm64.exe ./cmd/wslkit
      - uses: actions/upload-artifact@v4
        with:
          name: wslkit-dev
          path: dist/*.exe
