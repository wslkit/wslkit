name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      # Authenticode signing (ADR 0005) is added here once the SignPath project exists:
      # signing happens on the unpacked .exe before archiving, so this job will move to
      # a two-stage build/sign/package flow at that point.
