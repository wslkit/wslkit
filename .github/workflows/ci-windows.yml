name: ci-windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: integration + live smoke
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: unit + integration tests
        run: go test -count=1 -tags integration ./...
      - name: build
        run: go build -trimpath -o wsldoctor.exe ./cmd/wsldoctor
      - name: live smoke (hosted runners have no WSL 2; expect HST/WSL findings, never a crash)
        shell: pwsh
        run: |
          # Exit 1 means "findings", which is expected on a runner without WSL 2.
          # Only 2 (usage) and 3 (collector failure) or a crash fail this step.
          function Check([string[]]$argv) {
            & .\wsldoctor.exe @argv
            if ($LASTEXITCODE -notin 0,1) { throw "wsldoctor $argv exited with $LASTEXITCODE" }
          }
          Check @('check')
          Check @('check','--json') 6> $null | Out-File -Encoding utf8 env.json
          Check @('check','--from-snapshot','env.json','--verbose')
          Check @('check','--report')
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: runner-snapshot-${{ matrix.os }}
          path: env.json
