name: ci-windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: integration + live smoke
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm is slow (10m+ per run) and is exercised nightly instead.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build the guest agent for embedding
        run: go run ./tools/build-agent -version ci
      - name: unit + integration tests
        run: go test -count=1 -tags integration ./...
      - name: build
        run: go build -trimpath -o wslkit.exe ./cmd/wslkit
      - name: live smoke (hosted runners have no WSL 2; expect HST/WSL findings, never a crash)
        shell: pwsh
        run: |
          # Exit 1 means "findings", which is expected on a runner without WSL 2.
          # Only 2 (usage) and 3 (collector failure) or a crash fail this step.
          function Check([string[]]$argv) {
            & .\wslkit.exe @argv
            if ($LASTEXITCODE -notin 0,1) { throw "wslkit $argv exited with $LASTEXITCODE" }
          }
          Check @('doctor')
          Check @('doctor','check','--json') 6> $null | Out-File -Encoding utf8 env.json
          Check @('doctor','check','--from-snapshot','env.json','--verbose')
          Check @('doctor','--report')
          # Agent commands that need no VM: status/vm-id report "not running" (exit 1) on a runner.
          & .\wslkit.exe agent status
          if ($LASTEXITCODE -notin 0,1) { throw "agent status exited with $LASTEXITCODE" }
          & .\wslkit.exe agent vm-id
          if ($LASTEXITCODE -notin 0,1) { throw "agent vm-id exited with $LASTEXITCODE" }
          # Legacy alias: a copy named wsldoctor.exe must behave as `wslkit doctor`.
          Copy-Item wslkit.exe wsldoctor.exe
          & .\wsldoctor.exe --from-snapshot env.json | Select-Object -First 1
          if ($LASTEXITCODE -notin 0,1) { throw "wsldoctor alias exited with $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: runner-snapshot-${{ matrix.os }}
          path: env.json
