version: 2
project_name: wslkit

before:
  hooks:
    # Cross-compile the guest agent so it is embedded in wslkit.exe.
    - go run ./tools/build-agent -version {{.Version}}

builds:
  - id: wslkit
    main: ./cmd/wslkit
    binary: wslkit
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: zip
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_windows_{{ .Arch }}"
    files: [LICENSE*, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  use: github
  groups:
    - title: Doctor probes
      regexp: '^.*?(probe|WSL\d|HST\d|DSK\d|NET\d|MEM\d|DEF\d|PLG\d|EVT\d).*$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix.*$'
      order: 1
    - title: Other
      order: 999

release:
  prerelease: auto
  draft: false

# Scoop and winget publishing are enabled once the wslkit bucket exists. The
# Scoop manifest should add shims for both `wslkit` and the legacy `wsldoctor`
# name (the binary is multi-call: invoked as wsldoctor it runs `wslkit doctor`).
# scoops:
#   - repository: {owner: wslkit, name: scoop-wslkit}
#     homepage: https://github.com/wslkit/wslkit
#     description: Tools for WSL 2 - diagnose, fix and manage.
#     license: TBD
