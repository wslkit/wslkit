version: 2
project_name: wslkit

before:
  hooks:
    # Cross-compile the guest agent so it is embedded in wslkit.exe.
    - go run ./tools/build-agent -version {{.Version}}

builds:
  - id: wslkit
    main: ./cmd/wslkit
    binary: wslkit
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: zip
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_windows_{{ .Arch }}"
    files: [LICENSE*, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  use: github
  groups:
    - title: Doctor probes
      regexp: '^.*?(probe|WSL\d|HST\d|DSK\d|NET\d|MEM\d|DEF\d|PLG\d|EVT\d).*$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix.*$'
      order: 1
    - title: Other
      order: 999

release:
  prerelease: auto
  draft: false

# Scoop publishing does not happen here.
#
# goreleaser would need a token with write access to wslkit/scoop-wslkit, and a
# cross-repository secret is a standing grant that exists whether or not a
# release is running. The bucket updates itself instead: it watches this
# repository's releases and rewrites its own manifest with its own token, so
# nothing here has to be trusted with anything there.
#
# See wslkit/scoop-wslkit/.github/workflows/update.yml. The winget manifests are
# generated by tools/gen-winget and live in packaging/winget; submitting them to
# microsoft/winget-pkgs is a manual step, because it opens a pull request
# against a repository this project does not own.
