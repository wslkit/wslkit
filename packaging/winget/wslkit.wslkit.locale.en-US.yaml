ShortDescription: A toolkit for WSL 2 - troubleshooting and maintenance in one binary.
Description: |-
  wslkit is a set of tools for WSL 2 on Windows. Everything that only reads runs
  without administrator rights, nothing leaves the machine unless asked, and every
  change prints its plan first and records how to undo itself.

  doctor diagnoses why WSL is broken or slow and gives a ranked list of fixes.
  disk lists, trims, compacts, moves, rebuilds and trashes the virtual disks behind
  WSL 2, including the ones no distribution claims. top shows what the utility VM
  is using and which distribution is responsible, and limit caps what one of them
  may take. proxy gets a Windows proxy, PAC script included, working inside a
  distribution, and guard gets WSL answering again after the machine has slept.
  agent and sock bridge ssh-agent and gpg-agent from Windows into a distribution.
