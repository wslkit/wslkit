# Hugo config for the wslkit documentation site.
#
# No theme. The layouts in site/layouts are a couple of hundred lines of HTML
# and CSS, written here rather than pulled in: a project whose dependency
# allow-list is a decision record (ADR 0001) should not take a third-party
# theme, with its own update cadence and its own supply chain, to render a few
# dozen markdown files.
#
# content/ is generated by tools/gen-docs from docs/ and from the data tables
# the binary itself embeds, so docs/ stays the source of truth and keeps
# rendering on GitHub.
baseURL = "https://wslkit.github.io/wslkit/"
locale = "en-gb"
title = "wslkit"
enableRobotsTXT = true

# Hand-curated pages in a handful of groups do not need a second, weaker index.
disableKinds = ["taxonomy", "term", "rss"]

# The generator writes no dates; without this Hugo warns on every page.
[frontmatter]
  date = [":default", ":fileModTime"]

[markup.goldmark.renderer]
  # The docs contain no raw HTML, and keeping it off means a stray angle
  # bracket in a code sample cannot become markup.
  unsafe = false

[markup.goldmark.renderHooks.link]
  # Hugo resolves a markdown link to another .md page itself. That is what
  # lets docs/ keep writing `errors.md` and have it work both on GitHub and
  # here, with no rewriting and no second syntax to remember.
  useEmbedded = "fallback"

[markup.highlight]
  noClasses = false
  style = "github"

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
